{% extends 'base.html' %}{% block content %}<section class="card"><h1>{{ device.name }} 安装与选点</h1><p>先在手机端完成 Shadowrocket、WLOC 模块、MITM 和证书信任，再使用下面的选点工具。</p><ol><li>导入与你的客户端匹配的 WLOC 模块。</li><li>开启 MITM，确认已信任证书和 <code>gs-loc.apple.com</code>。</li><li>确保本页面由手机 Safari 打开且流量经过代理。</li></ol><div id="map"></div><div class="coords"><label>纬度<input id="lat" type="number" step="0.000001" value="31.2304"></label><label>经度<input id="lon" type="number" step="0.000001" value="121.4737"></label><label>名称<input id="name" value=""></label></div><button id="save" class="button">储存到设备</button><p id="status" class="status"></p><p class="note">按钮会请求 <code>{{ save_host }}</code>。只有手机端代理模块拦截时，坐标才会写入设备。</p></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const deviceId={{ device.id|tojson }};const saveHost={{ save_host|tojson }};const map=L.map('map').setView([31.2304,121.4737],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let marker=L.marker([31.2304,121.4737],{draggable:true}).addTo(map);function setPoint(lat,lon){document.querySelector('#lat').value=lat.toFixed(6);document.querySelector('#lon').value=lon.toFixed(6);marker.setLatLng([lat,lon]);}map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng));marker.on('dragend',e=>{const p=e.target.getLatLng();setPoint(p.lat,p.lng)});document.querySelector('#save').onclick=async()=>{const lat=Number(document.querySelector('#lat').value),lon=Number(document.querySelector('#lon').value),name=document.querySelector('#name').value;const s=document.querySelector('#status');if(!Number.isFinite(lat)||!Number.isFinite(lon)){s.textContent='请输入有效坐标';return}try{const db=await fetch('/api/locations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:deviceId,latitude:lat,longitude:lon,name})});const result=await db.json();if(!result.ok)throw new Error(result.error);const r=await fetch(saveHost+'?lon='+encodeURIComponent(lon)+'&lat='+encodeURIComponent(lat)+'&acc=25',{method:'GET',mode:'cors',cache:'no-store'});s.textContent=r.ok?'已发送储存请求：请查看手机端模块日志和地图验证。':'服务器已保存，但手机模块未返回成功，请检查代理/MITM/证书。'}catch(e){s.textContent='服务器已保存前的设备请求失败：'+e.message}};</script>{% endblock %}
