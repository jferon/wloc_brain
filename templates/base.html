<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WLOC Brain</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><a href="{{ url_for('index') }}">WLOC Brain</a>{% if g.user %}<span>{{ g.user.email }}</span><form method="post" action="{{ url_for('logout') }}"><button>退出</button></form>{% endif %}</header><main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
