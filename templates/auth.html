{% extends 'base.html' %}{% block content %}<section class="card auth"><h1>{{ '注册' if mode == 'register' else '登录' }}</h1><form method="post"><label>邮箱<input name="email" type="email" required autocomplete="email"></label><label>密码<input name="password" type="password" required minlength="8" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"></label><button class="button" type="submit">{{ '注册' if mode == 'register' else '登录' }}</button></form><p>{% if mode == 'register' %}<a href="{{ url_for('login') }}">已有账号，登录</a>{% else %}<a href="{{ url_for('register') }}">注册账号</a>{% endif %}</p></section>{% endblock %}
